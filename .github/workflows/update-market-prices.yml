name: Actualizar precios de mercado

# Zonaprop publica su Index a mediados de cada mes. El día 20 se busca el reporte nuevo,
# se extraen los precios del PDF y, si cambiaron y pasan los tests, se commitea el JSON
# (Vercel despliega solo). Si un PDF nuevo no se puede leer, el job falla para revisarlo a mano.
on:
  schedule:
    - cron: '0 12 20 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar reportes nuevos y extraer precios
        run: |
          pip install pypdf==6.16.2
          python scripts/update_market_prices.py

      - name: ¿Cambió algo?
        id: diff
        run: |
          if git diff --quiet -- src/infrastructure/data/marketPrices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- src/infrastructure/data/marketPrices.json
          fi

      - uses: pnpm/action-setup@v4
        if: steps.diff.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validar los datos nuevos con los tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run tests/marketPrices.test.ts

      - name: Commit y push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/data/marketPrices.json
          git commit -m "chore(datos): actualizar precios de mercado (Zonaprop Index)"
          git push
